name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor Tools
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor Configuration
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.snoopy.pixelsteward",
            "appName": "Pixel Steward",
            "webDir": ".",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true
            },
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Assets to Android
        run: |
          npx cap copy android

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

      - name: Grant Executable Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/PixelSteward.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelSteward-Android-APK
          path: release-output/PixelSteward.apk
          retention-days: 30
