name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/pages-config@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # อัปโหลดไฟล์ทั้งหมดจาก Root directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4